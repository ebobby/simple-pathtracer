[package]
name = "pathtracer"
version = "0.1.0"
authors = ["Francisco Soto <ebobby@ebobby.org>"]
edition = "2021"

[dependencies]
image = "0.24.5"
rand = "0.8.5"
rand_xoshiro = "0.6.0"
indicatif = "0.17.3"

# GPU acceleration
wgpu = "23.0"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "0.3"

# Real-time rendering
winit = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[bench]]
name = "render"
harness = false
